name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not include your web app URL, email address, bot token or chat ID.**
        For security vulnerabilities, use [private reporting](https://github.com/Sorbh/formbox/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request body
      description: The JSON you POSTed (redact personal data).
      render: json
  - type: textarea
    id: response
    attributes:
      label: Response / error
      description: The response you got, plus any errors from Apps Script → Executions.
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Google Sheets storage
        - Email notification
        - Telegram notification
        - Webhook callback
        - Rate limiting / honeypot
        - Validation
        - Setup / deployment
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Formbox version or commit
      placeholder: v1.0.0
